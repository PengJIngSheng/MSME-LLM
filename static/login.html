        <canvas id="techCanvas"></canvas>
    </div>

    <script src="/static/auth-profile-location.js?v=1.0.1"></script>
    <script>
        // Apply Translations
        function applyTranslations() {
            const t = authTranslations[currentLang] || authTranslations.en;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.innerHTML = t[key];
                }
            });
        }
        applyTranslations(); // Run on load

        function bindPasswordVisibility(inputId, buttonId) {
            const input = document.getElementById(inputId);
            const button = document.getElementById(buttonId);
            if (!input || !button) return;

            const update = () => {
                const hidden = input.type === 'password';
                const t = authTranslations[currentLang] || authTranslations.en;
                button.setAttribute('aria-pressed', String(!hidden));
                button.setAttribute('aria-label', hidden ? t.showPassword : t.hidePassword);
                button.title = hidden ? t.showPassword : t.hidePassword;
                button.querySelector('i').className = hidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
            };

            button.addEventListener('click', () => {
                input.type = input.type === 'password' ? 'text' : 'password';
                update();
                input.focus();
            });
            update();
        }
        bindPasswordVisibility('loginPassword', 'loginPasswordToggle');
        bindPasswordVisibility('registerPassword', 'registerPasswordToggle');

        function passwordRuleStatus(password) {
            return {
                length: password.length >= 8,
                uppercase: /^[A-Z]/.test(password),
                symbol: /[^\w\s]/.test(password)
            };
        }

        function passwordMeetsPolicy(password) {
            return Object.values(passwordRuleStatus(password)).every(Boolean);
        }

        function updateRegisterPasswordRequirements() {
            const password = document.getElementById('registerPassword').value;
            const rules = passwordRuleStatus(password);
            const requirements = document.getElementById('registerPasswordRequirements');
            const isValid = Object.values(rules).every(Boolean);
            if (isValid) requirements.classList.remove('has-error');
            document.querySelectorAll('[data-password-rule]').forEach(rule => {
                rule.classList.toggle('is-met', Boolean(rules[rule.dataset.passwordRule]));
            });
        }

        function showRegisterPasswordRequirementsError() {
            document.getElementById('registerPasswordRequirements').classList.add('has-error');
            updateRegisterPasswordRequirements();
        }

        document.getElementById('registerPassword').addEventListener('input', updateRegisterPasswordRequirements);
        updateRegisterPasswordRequirements();

        function setFieldError(input, errorId, message) {
            const error = document.getElementById(errorId);
            if (input) input.setAttribute('aria-invalid', message ? 'true' : 'false');
            if (error) error.textContent = message || '';
        }

        function validateNameFields(firstNameId, lastNameId, errorId) {
            const t = authTranslations[currentLang] || authTranslations.en;
            const firstName = document.getElementById(firstNameId);
            const lastName = document.getElementById(lastNameId);
            const firstValue = firstName.value.trim();
            const lastValue = lastName.value.trim();
            let message = '';
            const allowedName = /^[\p{L}\p{M} .'’-]+$/u;
            if (!firstValue || firstValue.length > 64 || !allowedName.test(firstValue)) message = t.invalidFirstName;
            else if (!lastValue || lastValue.length > 64 || !allowedName.test(lastValue)) message = t.invalidLastName;
            setFieldError(firstName, errorId, message);
            if (lastName) lastName.setAttribute('aria-invalid', message ? 'true' : 'false');
            return message ? null : { firstName: firstValue, lastName: lastValue };
        }

        function bindDigitsOnlyPhoneInput(inputId, errorId) {
            const input = document.getElementById(inputId);
            if (!input) return;
            input.addEventListener('beforeinput', (event) => {
                if (event.inputType?.startsWith('delete') || !event.data) return;
                if (!/^\d+$/.test(event.data)) {
                    event.preventDefault();
                    setFieldError(input, errorId, (authTranslations[currentLang] || authTranslations.en).phoneDigitsOnly);
                }
            });
            input.addEventListener('paste', (event) => {
                const pasted = event.clipboardData?.getData('text') || '';
                if (pasted && !/^\d+$/.test(pasted)) {
                    event.preventDefault();
                    setFieldError(input, errorId, (authTranslations[currentLang] || authTranslations.en).phoneDigitsOnly);
                }
            });
            input.addEventListener('input', () => {
                if (!/^\d*$/.test(input.value)) {
                    input.value = input.value.replace(/\D/g, '');
                    setFieldError(input, errorId, (authTranslations[currentLang] || authTranslations.en).phoneDigitsOnly);
                } else {
                    setFieldError(input, errorId, '');
                }
            });
        }

        async function validatePhoneField(countryIsoId, phoneId, errorId) {
            const t = authTranslations[currentLang] || authTranslations.en;
            const countryIso = document.getElementById(countryIsoId).value.trim();
            const phoneInput = document.getElementById(phoneId);
            const countryTrigger = phoneInput.closest('.phone-row')?.querySelector('.custom-select-trigger');
            const phoneNumber = phoneInput.value.trim();
            if (!countryIso) {
                if (countryTrigger) countryTrigger.setAttribute('aria-invalid', 'true');
                setFieldError(phoneInput, errorId, t.countryRequired);
                return null;
            }
            if (countryTrigger) countryTrigger.setAttribute('aria-invalid', 'false');
            if (!phoneNumber || !/^\d+$/.test(phoneNumber)) {
                setFieldError(phoneInput, errorId, phoneNumber ? t.phoneDigitsOnly : t.invalidPhone);
                return null;
            }
            try {
                const response = await fetch('/api/phone/validate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({country_iso: countryIso, phone_number: phoneNumber})
                });
                const data = await response.json().catch(() => ({}));
                if (response.status === 404) {
                    // A server deployed before this form's validation endpoint should
                    // not make a valid number look invalid to the person registering.
                    setFieldError(phoneInput, errorId, t.phoneValidationUnavailable);
                    return null;
                }
                if (!response.ok || data.status !== 'success') {
                    setFieldError(phoneInput, errorId, t.phoneInvalidForCountry);
                    return null;
                }
                setFieldError(phoneInput, errorId, '');
                return data;
            } catch (error) {
                setFieldError(phoneInput, errorId, t.networkError);
                return null;
            }
        }

        bindDigitsOnlyPhoneInput('registerPhone', 'registerPhoneError');
        bindDigitsOnlyPhoneInput('googleProfilePhone', 'googleProfilePhoneError');
        document.getElementById('registerPhoneCountrySelect').addEventListener('countrychange', () => {
            document.getElementById('registerPhoneCountryTrigger').setAttribute('aria-invalid', 'false');
            setFieldError(document.getElementById('registerPhone'), 'registerPhoneError', '');
        });
        document.getElementById('phoneCountrySelect').addEventListener('countrychange', () => {
            document.getElementById('phoneCountryTrigger').setAttribute('aria-invalid', 'false');
            setFieldError(document.getElementById('googleProfilePhone'), 'googleProfilePhoneError', '');
        });

        // Transition Logic
        const stepSelection = document.getElementById('stepSelection');
        const stepLoginForm = document.getElementById('stepLoginForm');
        const stepRegisterForm = document.getElementById('stepRegisterForm');
        const stepEmailOtpForm = document.getElementById('stepEmailOtpForm');
        const stepGoogleProfileForm = document.getElementById('stepGoogleProfileForm');
        const loginSelectionPanel = document.getElementById('loginSelectionPanel');
        const registerSelectionPanel = document.getElementById('registerSelectionPanel');
        const PROFILE_SKIP_KEY = 'pepperSkipGoogleProfileCompletion';
        let activeAuthMode = 'login';
        let modeTransitionTimer = null;
        let authStepTransitionTimer = null;
        let formEntranceTimer = null;

        function requestedAuthMode() {
            return new URLSearchParams(window.location.search).get('mode') === 'register' ? 'register' : 'login';
        }

        function updateAuthModeUrl(mode, replace = false) {
            const url = new URL(window.location.href);
            url.searchParams.set('mode', mode);
            window.history[replace ? 'replaceState' : 'pushState']({}, '', `${url.pathname}${url.search}${url.hash}`);
        }

        function setAuthMode(mode, { animate = true, updateUrl = true, replaceUrl = false } = {}) {
            const nextMode = mode === 'register' ? 'register' : 'login';
            if (modeTransitionTimer) {
                window.clearTimeout(modeTransitionTimer);
                modeTransitionTimer = null;
            }
            loginSelectionPanel.classList.remove('mode-exiting');
            registerSelectionPanel.classList.remove('mode-exiting');
            const outgoing = activeAuthMode === 'register' ? registerSelectionPanel : loginSelectionPanel;
            const incoming = nextMode === 'register' ? registerSelectionPanel : loginSelectionPanel;

            if (activeAuthMode === nextMode && !outgoing.classList.contains('hidden')) {
                if (updateUrl) updateAuthModeUrl(nextMode, replaceUrl);
                return;
            }

            activeAuthMode = nextMode;
            if (updateUrl) updateAuthModeUrl(nextMode, replaceUrl);

            const revealIncoming = () => {
                modeTransitionTimer = null;
                if (activeAuthMode !== nextMode) return;
                outgoing.classList.add('hidden');
                outgoing.classList.remove('mode-exiting');
                incoming.classList.remove('hidden');
                if (animate) {
                    incoming.classList.add('mode-entering');
                    window.requestAnimationFrame(() => incoming.classList.remove('mode-entering'));
                }
            };

            if (animate && !outgoing.classList.contains('hidden')) {
                outgoing.classList.add('mode-exiting');
                modeTransitionTimer = window.setTimeout(revealIncoming, 220);
            } else {
                revealIncoming();
            }
        }

        function playFormEntrance(step) {
            if (formEntranceTimer) window.clearTimeout(formEntranceTimer);
            const motionReduced = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
            step.classList.remove('form-entering', 'form-exiting');
            if (motionReduced) return;
            void step.offsetWidth;
            step.classList.add('form-entering');
            formEntranceTimer = window.setTimeout(() => {
                step.classList.remove('form-entering');
                formEntranceTimer = null;
            }, 680);
        }

        function transitionToStep(formStep) {
            if (authStepTransitionTimer) {
                window.clearTimeout(authStepTransitionTimer);
                authStepTransitionTimer = null;
            }
            const outgoing = [stepSelection, stepLoginForm, stepRegisterForm, stepEmailOtpForm, stepGoogleProfileForm]
                .find(step => step !== formStep && !step.classList.contains('hidden'));
            const transitionDuration = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 0 : 180;

            const revealForm = () => {
                authStepTransitionTimer = null;
                if (outgoing) outgoing.classList.add('hidden');
                formStep.classList.remove('hidden');
                playFormEntrance(formStep);
            };

            if (outgoing) {
                outgoing.classList.remove('form-entering');
                outgoing.classList.add('form-exiting');
                authStepTransitionTimer = window.setTimeout(revealForm, transitionDuration);
            } else {
                revealForm();
            }
        }

        function showFormStep(formStep) {
            document.body.classList.remove('profile-completion-active');
            document.body.classList.add('email-form-active');
            document.querySelector('.auth-box').classList.remove('profile-mode');
            transitionToStep(formStep);
        }

        function backToSelection(fromStep) {
            if (authStepTransitionTimer) {
                window.clearTimeout(authStepTransitionTimer);
                authStepTransitionTimer = null;
            }
            document.body.classList.remove('profile-completion-active', 'email-form-active');
            document.querySelector('.auth-box').classList.remove('profile-mode');
            fromStep.classList.remove('form-entering');
            fromStep.classList.add('form-exiting');
            const transitionDuration = window.matchMedia?.('(prefers-reduced-motion: reduce)').matches ? 0 : 180;
            authStepTransitionTimer = window.setTimeout(() => {
                authStepTransitionTimer = null;
                fromStep.classList.add('hidden');
                stepSelection.classList.remove('hidden');
                playFormEntrance(stepSelection);
            }, transitionDuration);
        }

        function leaveProfileCompletionForHome(event) {
            // Keep every auth sub-step inside the same flow.  In particular, the
            // brand link must not strand someone on the home page from email OTP.
            if (!stepEmailOtpForm.classList.contains('hidden')) {
                event.preventDefault();
                returnFromEmailOtp();
                return;
            }
            if (!document.body.classList.contains('profile-completion-active')) return;
            event.preventDefault();
            sessionStorage.removeItem('pepperCompleteGoogleProfile');
            sessionStorage.setItem(PROFILE_SKIP_KEY, '1');
            localStorage.setItem('pepperRequiresProfileCompletion', 'true');
            window.location.href = '/';
        }

        document.getElementById('logoHomeLink').addEventListener('click', leaveProfileCompletionForHome);

        function openLoginForm() {
            const t = authTranslations[currentLang] || authTranslations.en;
            document.getElementById('loginFormTitle').innerHTML = t.title2;
            document.getElementById('loginIdentifierLabel').innerHTML = t.emailUser;
            showFormStep(stepLoginForm);
        }

        function openRegisterForm() {
            const t = authTranslations[currentLang] || authTranslations.en;
            document.getElementById('registerFormTitle').innerHTML = t.registerTitle2;
            if (window.MSMEProfileLocation) {
                window.MSMEProfileLocation.initPhoneRegionForm({
                    useStoredProfile: false,
                    countryCodeInputId: 'registerCountryCode',
                    countryInputId: 'registerCountry',
                    countryIsoInputId: 'registerCountryIso',
                    regionInputId: 'registerRegion',
                    requireCountrySelection: true,
                    countryPlaceholder: t.selectCountry,
                    regionPlaceholder: t.selectRegion,
                    phoneRootId: 'registerPhoneCountrySelect',
                    phoneTriggerId: 'registerPhoneCountryTrigger',
                    phoneFlagId: 'registerPhoneCountryFlag',
                    phoneLabelId: 'registerPhoneCountryLabel',
                    phoneMenuId: 'registerPhoneCountryMenu',
                    regionRootId: 'registerRegionSelect',
                    regionTriggerId: 'registerRegionTrigger',
                    regionLabelId: 'registerRegionLabel',
                    regionMenuId: 'registerRegionMenu'
                });
            }
            showFormStep(stepRegisterForm);
        }

        const emailOtpInputs = [...document.querySelectorAll('#emailOtpInputs .otp-input')];
        const emailOtpContainer = document.getElementById('emailOtpInputs');
        const emailOtpError = document.getElementById('emailOtpError');
        const EMAIL_OTP_RESEND_COOLDOWN_SECONDS = 60;
        const EMAIL_OTP_ORIGIN_KEY = 'pendingEmailOtpOrigin';
        let emailOtpCooldownTimer = null;

        function pendingEmailVerificationId() {
            return localStorage.getItem('pendingUserId') || '';
        }

        function normaliseEmailOtpOrigin(value) {
            return value === 'login' ? 'login' : 'register';
        }

        function emailOtpOrigin() {
            const params = new URLSearchParams(window.location.search || '');
            return normaliseEmailOtpOrigin(params.get('from') || sessionStorage.getItem(EMAIL_OTP_ORIGIN_KEY));
        }

        function setEmailOtpOrigin(source) {
            const normalised = normaliseEmailOtpOrigin(source);
            sessionStorage.setItem(EMAIL_OTP_ORIGIN_KEY, normalised);
            return normalised;
        }

        function hasEmailOtpIntent() {
            const params = new URLSearchParams(window.location.search || '');
            const pendingIdFromLegacyUrl = params.get('id');
            if (pendingIdFromLegacyUrl) {
                localStorage.setItem('pendingUserId', pendingIdFromLegacyUrl);
                setEmailOtpOrigin(params.get('from'));
                return true;
            }
            if (params.get('verify') === 'email') setEmailOtpOrigin(params.get('from'));
            return params.get('verify') === 'email' && Boolean(pendingEmailVerificationId());
        }

        function updateEmailOtpUrl({ replace = false, source = emailOtpOrigin() } = {}) {
            const normalisedSource = setEmailOtpOrigin(source);
            const url = new URL(window.location.href);
            url.searchParams.set('mode', 'register');
            url.searchParams.set('verify', 'email');
            url.searchParams.set('from', normalisedSource);
            // The pending id remains in browser storage, rather than the address bar.
            url.searchParams.delete('id');
            window.history[replace ? 'replaceState' : 'pushState'](
                { authStep: 'email-otp', from: normalisedSource },
                '',
                `${url.pathname}${url.search}${url.hash}`,
            );
        }

        function clearEmailOtpUrl() {
            const url = new URL(window.location.href);
            url.searchParams.delete('verify');
            url.searchParams.delete('id');
            url.searchParams.delete('from');
            window.history.replaceState({}, '', `${url.pathname}${url.search}${url.hash}`);
        }

        function emailOtpCode() {
            return emailOtpInputs.map(input => input.value).join('');
        }

        function showEmailOtpError(message = '', { success = false } = {}) {
            emailOtpError.textContent = message;
            emailOtpError.classList.toggle('is-success', Boolean(message) && success);
        }

        function clearEmailOtpInputs({ focus = false } = {}) {
            emailOtpInputs.forEach(input => {
                input.value = '';
                input.classList.remove('filled');
            });
            if (focus) emailOtpInputs[0]?.focus();
        }

        function shakeEmailOtpInputs() {
            emailOtpContainer.classList.remove('shake');
            void emailOtpContainer.offsetWidth;
            emailOtpContainer.classList.add('shake');
        }

        function emailOtpCooldownStorageKey(pendingId) {
            return `emailOtpResendCooldownUntil:${pendingId}`;
        }

        function stopEmailOtpCooldown() {
            if (emailOtpCooldownTimer) window.clearInterval(emailOtpCooldownTimer);
            emailOtpCooldownTimer = null;
        }

        function setEmailOtpResendButton(remainingSeconds) {
            const t = authTranslations[currentLang] || authTranslations.en;
            const button = document.getElementById('emailOtpResendBtn');
            const isCoolingDown = remainingSeconds > 0;
            button.disabled = isCoolingDown;
            button.textContent = isCoolingDown
                ? t.otpResendIn.replace('{seconds}', String(remainingSeconds))
                : t.otpResend;
        }

        function startEmailOtpCooldown(seconds) {
            const pendingId = pendingEmailVerificationId();
            if (!pendingId) return;
            const expiresAt = Date.now() + Math.max(0, seconds) * 1000;
            sessionStorage.setItem(emailOtpCooldownStorageKey(pendingId), String(expiresAt));
            stopEmailOtpCooldown();
            const render = () => {
                const remaining = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
                setEmailOtpResendButton(remaining);
                if (remaining === 0) {
                    stopEmailOtpCooldown();
                    sessionStorage.removeItem(emailOtpCooldownStorageKey(pendingId));
                }
            };
            render();
            if (expiresAt > Date.now()) emailOtpCooldownTimer = window.setInterval(render, 250);
        }

        function restoreEmailOtpCooldown() {
            const pendingId = pendingEmailVerificationId();
            if (!pendingId) return setEmailOtpResendButton(0);
            const expiresAt = Number(sessionStorage.getItem(emailOtpCooldownStorageKey(pendingId)) || 0);
            const remaining = Math.max(0, Math.ceil((expiresAt - Date.now()) / 1000));
            if (remaining) startEmailOtpCooldown(remaining);
            else {
                sessionStorage.removeItem(emailOtpCooldownStorageKey(pendingId));
                stopEmailOtpCooldown();
                setEmailOtpResendButton(0);
            }
        }

        function returnFromEmailOtp({ updateUrl = true } = {}) {
            const source = emailOtpOrigin();
            stopEmailOtpCooldown();
            sessionStorage.removeItem(EMAIL_OTP_ORIGIN_KEY);
            showEmailOtpError('');
            if (updateUrl) clearEmailOtpUrl();
            if (source === 'login') {
                const button = document.getElementById('loginSubmitBtn');
                button.disabled = false;
                button.textContent = (authTranslations[currentLang] || authTranslations.en).submit;
                showFormStep(stepLoginForm);
            } else {
                const button = document.getElementById('registerSubmitBtn');
                button.disabled = false;
                button.textContent = (authTranslations[currentLang] || authTranslations.en).registerSubmit;
                showFormStep(stepRegisterForm);
            }
        }

        function openEmailOtpForm(userId, { animate = true, updateUrl = true, source, resendCooldownSeconds = 0 } = {}) {
            const pendingId = userId || pendingEmailVerificationId();
            if (!pendingId) return false;
            localStorage.setItem('pendingUserId', pendingId);
            const origin = setEmailOtpOrigin(source || emailOtpOrigin());
            activeAuthMode = 'register';
            if (updateUrl) updateEmailOtpUrl({ replace: !animate, source: origin });
            const t = authTranslations[currentLang] || authTranslations.en;
            document.getElementById('emailOtpTitle').textContent = t.otpTitle;
            document.getElementById('emailOtpDescription').textContent = t.otpDescription;
            document.getElementById('emailOtpVerifyBtn').textContent = t.otpVerify;
            document.getElementById('emailOtpResendBtn').textContent = t.otpResend;
            const backButton = document.getElementById('backFromEmailOtpBtn');
            backButton.setAttribute('aria-label', t.otpBack);
            backButton.title = t.otpBack;
            showEmailOtpError('');
            clearEmailOtpInputs();
            showFormStep(stepEmailOtpForm);
            if (resendCooldownSeconds > 0) startEmailOtpCooldown(resendCooldownSeconds);
            else restoreEmailOtpCooldown();
            window.setTimeout(() => emailOtpInputs[0]?.focus(), animate ? 310 : 0);
            return true;
        }

        emailOtpInputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/\D/g, '').slice(0, 1);
                input.classList.toggle('filled', Boolean(input.value));
                showEmailOtpError('');
                if (input.value && emailOtpInputs[index + 1]) emailOtpInputs[index + 1].focus();
            });
            input.addEventListener('keydown', event => {
                if (event.key === 'Backspace' && !input.value && emailOtpInputs[index - 1]) {
                    emailOtpInputs[index - 1].focus();
                }
            });
            input.addEventListener('paste', event => {
                const digits = (event.clipboardData?.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                if (!digits) return;
                event.preventDefault();
                clearEmailOtpInputs();
                digits.split('').forEach((digit, digitIndex) => {
                    if (!emailOtpInputs[digitIndex]) return;
                    emailOtpInputs[digitIndex].value = digit;
                    emailOtpInputs[digitIndex].classList.add('filled');
                });
                emailOtpInputs[Math.min(digits.length, 6) - 1]?.focus();
            });
        });

        function storeVerifiedEmailSession(data) {
            localStorage.setItem('pepperSession', 'cookie');
            localStorage.setItem('pepperUserId', data.user_id);
            localStorage.setItem('pepperUsername', data.username);
            if (data.display_name) localStorage.setItem('pepperDisplayName', data.display_name);
            if (data.preferences?.language) localStorage.setItem('pepperLang', data.preferences.language);
            localStorage.removeItem('pendingUserId');
            sessionStorage.removeItem(EMAIL_OTP_ORIGIN_KEY);
            stopEmailOtpCooldown();
            clearEmailOtpUrl();
        }

        document.getElementById('emailOtpForm').addEventListener('submit', async event => {
            event.preventDefault();
            const t = authTranslations[currentLang] || authTranslations.en;
            const pendingId = pendingEmailVerificationId();
            const otp = emailOtpCode();
            if (!pendingId || otp.length !== 6) {
                shakeEmailOtpInputs();
                showEmailOtpError(t.otpMissing);
                return;
            }
            const button = document.getElementById('emailOtpVerifyBtn');
            button.disabled = true;
            button.textContent = t.otpVerifying;
            emailOtpContainer.classList.add('verifying');
            showEmailOtpError('');
            try {
                const response = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: pendingId, otp })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.status !== 'success') throw new Error(data.detail || t.otpFailed);
                storeVerifiedEmailSession(data);
                window.location.assign('/');
            } catch (error) {
                emailOtpContainer.classList.remove('verifying');
                clearEmailOtpInputs({ focus: true });
                shakeEmailOtpInputs();
                showEmailOtpError(error.message || t.otpFailed);
                button.disabled = false;
                button.textContent = t.otpVerify;
            }
        });

        document.getElementById('emailOtpResendBtn').addEventListener('click', async () => {
            const t = authTranslations[currentLang] || authTranslations.en;
            const pendingId = pendingEmailVerificationId();
            if (!pendingId) {
                showEmailOtpError(t.otpFailed);
                return;
            }
            // Start the visible cooldown before the request returns. If the
            // network result is unknown, this still prevents duplicate sends.
            startEmailOtpCooldown(EMAIL_OTP_RESEND_COOLDOWN_SECONDS);
            try {
                const response = await fetch('/api/resend-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: pendingId })
                });
                const data = await response.json().catch(() => ({}));
                if (!response.ok || data.status !== 'resent') {
                    const retryAfter = Number(data.retry_after || response.headers.get('Retry-After'));
                    if (Number.isFinite(retryAfter) && retryAfter > 0) startEmailOtpCooldown(retryAfter);
                    throw new Error(data.detail || t.otpFailed);
                }
                startEmailOtpCooldown(Number(data.resend_available_in) || EMAIL_OTP_RESEND_COOLDOWN_SECONDS);
                clearEmailOtpInputs({ focus: true });
                showEmailOtpError(t.otpResent, { success: true });
            } catch (error) {
                shakeEmailOtpInputs();
                showEmailOtpError(error.message || t.otpFailed);
            }
        });

        document.getElementById('backFromEmailOtpBtn').addEventListener('click', () => {
            returnFromEmailOtp();
        });

        function splitDisplayNameForForm(value) {
            const parts = (value || '').trim().split(/\s+/, 2);
            return { firstName: parts[0] || '', lastName: parts[1] || '' };
        }

        function openGoogleProfileForm() {
            const t = authTranslations[currentLang] || authTranslations.en;
            const firstNameInput = document.getElementById('googleProfileFirstName');
            const lastNameInput = document.getElementById('googleProfileLastName');
            const countryCodeInput = document.getElementById('googleProfileCountryCode');
            const countryInput = document.getElementById('googleProfileCountry');
            const regionInput = document.getElementById('googleProfileRegion');
            const storedCountryCode = localStorage.getItem('pepperPhoneCountryCode') || '';
            const storedCountry = localStorage.getItem('pepperCountry') || '';
            const storedRegion = localStorage.getItem('pepperRegion') || '';
            document.body.classList.add('profile-completion-active');
            document.body.classList.remove('email-form-active');
            document.querySelector('.auth-box').classList.add('profile-mode');
            const profileName = splitDisplayNameForForm(localStorage.getItem('pepperDisplayName'));
            if (firstNameInput) firstNameInput.value = profileName.firstName;
            if (lastNameInput) lastNameInput.value = profileName.lastName;
            if (countryCodeInput) countryCodeInput.value = storedCountryCode || '+60';
            if (countryInput) countryInput.value = storedCountry || 'Malaysia';
            if (regionInput) regionInput.value = storedRegion;
            if (window.MSMEProfileLocation) {
                window.MSMEProfileLocation.initGoogleProfileLocationForm({
                    preferredCountryCode: storedCountryCode,
                    preferredCountry: storedCountry,
                    preferredRegion: storedRegion,
                    countryIsoInputId: 'googleProfileCountryIso',
                    requireCountrySelection: true,
                    countryPlaceholder: t.selectCountry,
                    regionPlaceholder: t.selectRegion
                });
            } else if (regionInput && !regionInput.value) {
                regionInput.value = 'Malaysia - Selangor';
            }

            stepSelection.classList.add('hidden');
            stepLoginForm.classList.add('hidden');
            stepRegisterForm.classList.add('hidden');
            stepEmailOtpForm.classList.add('hidden');
            stepGoogleProfileForm.classList.remove('hidden');
            playFormEntrance(stepGoogleProfileForm);
        }

        function hasGoogleProfileCompletionIntent() {
            const params = new URLSearchParams(window.location.search || '');
            return (
                params.get('complete') === 'google'
                || sessionStorage.getItem('pepperCompleteGoogleProfile') === '1'
            );
        }

        function shouldCompleteGoogleProfile() {
            return Boolean(localStorage.getItem('pepperSession')) && hasGoogleProfileCompletionIntent();
        }

        function clearGoogleProfileCompletionState() {
            sessionStorage.removeItem('pepperCompleteGoogleProfile');
            sessionStorage.removeItem(PROFILE_SKIP_KEY);
            localStorage.setItem('pepperRequiresProfileCompletion', 'false');
        }

        async function redirectIncompleteGoogleProfileFromServer() {
            const token = localStorage.getItem('pepperSession');
            if (!token) return;
            try {
                const res = await fetch('/api/account/preferences', {
                    headers: { 'Authorization': `Bearer ${token}` },
                    cache: 'no-store'
                });
                if (!res.ok) return;
                const data = await res.json();
                if (data.display_name) localStorage.setItem('pepperDisplayName', data.display_name);
                if (data.country_code || data.phone_country_code) localStorage.setItem('pepperPhoneCountryCode', data.country_code || data.phone_country_code);
                if (data.country_iso) localStorage.setItem('pepperCountryIso', data.country_iso);
                if (data.region) localStorage.setItem('pepperRegion', data.region);
                if (data.requires_profile_completion) {
                    sessionStorage.setItem('pepperCompleteGoogleProfile', '1');
                    localStorage.setItem('pepperRequiresProfileCompletion', 'true');
                    openGoogleProfileForm();
                } else {
                    sessionStorage.removeItem('pepperCompleteGoogleProfile');
                    localStorage.setItem('pepperRequiresProfileCompletion', 'false');
                }
            } catch (err) {
                console.warn('Failed to check Google profile completion', err);
            }
        }

        document.getElementById('openEmailFormBtn').addEventListener('click', () => {
            openLoginForm();
        });

        document.getElementById('openRegisterEmailFormBtn').addEventListener('click', () => {
            openRegisterForm();
        });

        document.getElementById('backToSelectionBtn').addEventListener('click', () => {
            backToSelection(stepLoginForm);
        });

        document.getElementById('backFromRegisterBtn').addEventListener('click', () => {
            backToSelection(stepRegisterForm);
        });

        document.getElementById('switchToRegisterLink').addEventListener('click', (event) => {
            event.preventDefault();
            setAuthMode('register');
        });

        document.getElementById('switchToLoginLink').addEventListener('click', (event) => {
            event.preventDefault();
            setAuthMode('login');
        });

        window.addEventListener('popstate', () => {
            if (hasEmailOtpIntent()) {
                openEmailOtpForm(null, { animate: false, updateUrl: false });
            } else if (!stepEmailOtpForm.classList.contains('hidden')) {
                // Back from the OTP history entry returns to the form that
                // initiated it, without losing the values still in the DOM.
                returnFromEmailOtp({ updateUrl: false });
            } else {
                setAuthMode(requestedAuthMode(), { updateUrl: false });
            }
        });
        setAuthMode(requestedAuthMode(), { animate: false, updateUrl: false });

        // Toast logic
        const toastBox = document.getElementById('toastBox');
        const toastMsg = document.getElementById('toastMsg');
        function showToast(msg, isError=false) {
            const t = authTranslations[currentLang] || authTranslations.en;
            const translated = {
                'Network error.': t.networkError,
                'Google OAuth 模块加载中，请稍后再试。': t.googleOAuthLoading,
                'Password must contain at least 8 characters': t.passwordRule,
                'Password must start with an uppercase letter': t.passwordRule,
                'Password must contain at least one special character': t.passwordRule,
                'Invalid username or password': t.invalidCredentials,
                'Username already taken': t.usernameTaken,
                'Phone number already registered': t.phoneAlreadyRegistered,
                'This email is already registered with Google. Please log in with Google.': t.googleEmailRegistered
            }[msg] || msg;
            toastMsg.innerText = currentLang !== 'en' && /^[\x00-\x7F]+$/.test(translated) ? t.genericError : translated;
            toastBox.className = 'toast show ' + (isError ? 'error' : '');
            setTimeout(() => { toastBox.classList.remove('show'); }, 4000);
        }

        const pendingGoogleAuthError = sessionStorage.getItem('pepperGoogleAuthError');
        if (pendingGoogleAuthError) {
            sessionStorage.removeItem('pepperGoogleAuthError');
            sessionStorage.removeItem('pepperRestartGoogleRegistration');
            if (/valid phone number/i.test(pendingGoogleAuthError)) {
                sessionStorage.setItem('pepperCompleteGoogleProfile', '1');
                localStorage.setItem('pepperRequiresProfileCompletion', 'true');
                setTimeout(() => {
                    if (localStorage.getItem('pepperSession')) openGoogleProfileForm();
                }, 0);
            } else {
                setTimeout(() => showToast(pendingGoogleAuthError, true), 0);
            }
        }

        // Form Submit Logic
        let googleOAuthClientId = '';
        let googleLoginRedirectUriValue = '';
        function canonicalBrowserOrigin() {
            const url = new URL(window.location.href);
            if (url.hostname.toLowerCase() === 'bisnes.ai.') url.hostname = 'bisnes.ai';
            return url.origin;
        }
        function googleLoginRedirectUri() {
            return googleLoginRedirectUriValue || new URL('/', canonicalBrowserOrigin()).href;
        }
        async function loadPublicConfig() {
            const res = await fetch('/api/public-config', { cache: 'no-store' });
            if (!res.ok) throw new Error('Google OAuth configuration is unavailable');
            const data = await res.json();
            const loginClientId = data.google_login_oauth_client_id || data.google_oauth_client_id;
            if (!loginClientId) throw new Error('Google OAuth client ID is unavailable');
            googleOAuthClientId = loginClientId;
            if (data.google_login_redirect_uri) googleLoginRedirectUriValue = data.google_login_redirect_uri;
        }
        const publicConfigReady = loadPublicConfig().catch(error => {
            console.warn('Failed to load public OAuth configuration', error);
            return null;
        });

        function showGoogleOAuthError(error) {
            console.warn('Google OAuth failed', error);
            const t = authTranslations[currentLang] || authTranslations.en;
            const message = String(error?.message || error || '');
            const configurationProblem = /access.?blocked|redirect_uri|origin|unauthorized_client|configuration|client id/i.test(message);
            showToast(configurationProblem ? t.googleOAuthConfiguration : t.googleOAuthLoading, true);
        }

        function createGoogleAuthState() {
            if (window.crypto && typeof window.crypto.randomUUID === 'function') {
                return window.crypto.randomUUID();
            }
            return `google-${Date.now()}-${Math.random().toString(16).slice(2)}`;
        }

        function storeGoogleAuthData(data) {
            localStorage.setItem('pepperSession', 'cookie');
            localStorage.setItem('pepperUserId', data.user_id);
            localStorage.setItem('pepperUsername', data.username);
            localStorage.setItem('pepperGoogleLinked', 'true');
            localStorage.setItem('pepperAuthProvider', 'google');
            if (data.username) localStorage.setItem('pepperGoogleEmail', data.username);
            if (data.display_name) localStorage.setItem('pepperDisplayName', data.display_name);
            if (data.avatarUrl) localStorage.setItem('pepperAvatar', data.avatarUrl);
            if (data.preferences?.language) localStorage.setItem('pepperLang', data.preferences.language);
            if (Object.prototype.hasOwnProperty.call(data, 'phone')) {
                if (data.phone) localStorage.setItem('pepperPhone', data.phone);
                else localStorage.removeItem('pepperPhone');
            }
            if (Object.prototype.hasOwnProperty.call(data, 'country_code') || Object.prototype.hasOwnProperty.call(data, 'phone_country_code')) {
                const countryCode = data.country_code || data.phone_country_code;
                if (countryCode) localStorage.setItem('pepperPhoneCountryCode', countryCode);
                else localStorage.removeItem('pepperPhoneCountryCode');
            }
            if (Object.prototype.hasOwnProperty.call(data, 'country_iso')) {
                if (data.country_iso) localStorage.setItem('pepperCountryIso', data.country_iso);
                else localStorage.removeItem('pepperCountryIso');
            }
            if (Object.prototype.hasOwnProperty.call(data, 'region')) {
                if (data.region) localStorage.setItem('pepperRegion', data.region);
                else localStorage.removeItem('pepperRegion');
            }
            if (Object.prototype.hasOwnProperty.call(data, 'requires_profile_completion')) {
                localStorage.setItem('pepperRequiresProfileCompletion', data.requires_profile_completion ? 'true' : 'false');
            }
        }

        async function finishGoogleAuthWithToken(accessToken) {
            const res = await fetch('/api/auth/google', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    token: accessToken,
                    language: currentLang
                })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || data.status !== 'success') {
                throw new Error(data.detail || data.message || 'Google Login Failed');
            }
            storeGoogleAuthData(data);
            if (data.requires_profile_completion) {
                sessionStorage.removeItem(PROFILE_SKIP_KEY);
                sessionStorage.setItem('pepperCompleteGoogleProfile', '1');
                openGoogleProfileForm();
            } else {
                clearGoogleProfileCompletionState();
                window.location.href = '/';
            }
        }

        async function startGoogleFullScreenAuth() {
            await publicConfigReady;
            if (!googleOAuthClientId) {
                throw new Error('Google OAuth client ID is unavailable');
            }
            if (!window.google?.accounts?.oauth2) {
                throw new Error('Google OAuth 模块加载中，请稍后再试。');
            }
            sessionStorage.removeItem(PROFILE_SKIP_KEY);
            sessionStorage.removeItem('pepperGoogleFullscreenAuth');
            localStorage.removeItem('pepperGoogleFullscreenAuth');

            await new Promise((resolve, reject) => {
                const client = google.accounts.oauth2.initTokenClient({
                    client_id: googleOAuthClientId,
                    scope: 'openid email profile',
                    include_granted_scopes: true,
                    prompt: 'select_account',
                    callback: async (response) => {
                        try {
                            if (!response?.access_token) {
                                throw new Error(response?.error || 'Google Login Failed');
                            }
                            await finishGoogleAuthWithToken(response.access_token);
                            resolve();
                        } catch (err) {
                            reject(err);
                        }
                    },
                    error_callback: (error) => {
                        reject(new Error(error?.message || error?.type || 'Google OAuth popup was closed.'));
                    }
                });
                client.requestAccessToken({ prompt: 'select_account' });
            });
        }

        async function startGoogleRedirectAuthFallback() {
            await publicConfigReady;
            const state = createGoogleAuthState();
            const authPayload = JSON.stringify({
                state,
                purpose: 'login',
                language: currentLang,
                returnPath: '/',
                createdAt: Date.now()
            });
            sessionStorage.removeItem(PROFILE_SKIP_KEY);
            sessionStorage.setItem('pepperGoogleFullscreenAuth', authPayload);
            localStorage.setItem('pepperGoogleFullscreenAuth', authPayload);

            const params = new URLSearchParams({
                client_id: googleOAuthClientId,
                redirect_uri: googleLoginRedirectUri(),
                response_type: 'token',
                scope: 'openid email profile',
                include_granted_scopes: 'true',
                prompt: 'select_account',
                state
            });
            window.location.assign(`https://accounts.google.com/o/oauth2/v2/auth?${params.toString()}`);
        }

        document.getElementById('loginGoogleAuthBtn').addEventListener('click', () => {
            startGoogleFullScreenAuth().catch(showGoogleOAuthError);
        });

        document.getElementById('registerGoogleAuthBtn').addEventListener('click', () => {
            startGoogleFullScreenAuth().catch(showGoogleOAuthError);
        });

        document.getElementById('googleProfileForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const t = authTranslations[currentLang] || authTranslations.en;
            const btn = document.getElementById('googleProfileSubmitBtn');
            const identity = validateNameFields('googleProfileFirstName', 'googleProfileLastName', 'googleProfileNameError');
            if (!identity) {
                showToast(document.getElementById('googleProfileNameError').textContent, true);
                return;
            }
            const phoneData = await validatePhoneField('googleProfileCountryIso', 'googleProfilePhone', 'googleProfilePhoneError');
            if (!phoneData) {
                showToast(document.getElementById('googleProfilePhoneError').textContent || t.invalidPhone, true);
                return;
            }
            const country = document.getElementById('googleProfileCountry')?.value || '';
            const region = document.getElementById('googleProfileRegion').value;
            if (!region) {
                showToast(t.invalidRegion, true);
                return;
            }

            try {
                btn.textContent = t.saving;
                btn.disabled = true;
                const res = await fetch('/api/account/complete-google-profile', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('pepperSession')}`
                    },
                    body: JSON.stringify({
                        first_name: identity.firstName,
                        last_name: identity.lastName,
                        country_iso: phoneData.country_iso,
                        phone_number: phoneData.phone_number,
                        region
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || data.status !== 'success') {
                    throw new Error(data.detail || t.completeFailed);
                }
                localStorage.setItem('pepperDisplayName', data.display_name || `${identity.firstName} ${identity.lastName}`);
                localStorage.setItem('pepperPhone', data.phone_e164 || data.phone || phoneData.phone_e164);
                localStorage.setItem('pepperPhoneCountryCode', data.country_code || phoneData.country_code);
                if (country) localStorage.setItem('pepperCountry', country);
                localStorage.setItem('pepperRegion', data.region || region);
                clearGoogleProfileCompletionState();
                window.location.href = '/';
            } catch(error) {
                showToast(error.message || t.completeFailed, true);
                btn.textContent = t.continueBtn;
                btn.disabled = false;
            }
        });

        if (shouldCompleteGoogleProfile()) {
            openGoogleProfileForm();
        } else if (hasEmailOtpIntent()) {
            openEmailOtpForm(null, { animate: false, updateUrl: true });
        } else if (!localStorage.getItem('pepperSession')) {
            sessionStorage.removeItem('pepperCompleteGoogleProfile');
            sessionStorage.removeItem('pepperRestartGoogleRegistration');
            localStorage.setItem('pepperRequiresProfileCompletion', 'false');
        } else {
            redirectIncompleteGoogleProfileFromServer();
        }

        document.getElementById('standaloneLoginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginSubmitBtn');
            const u = document.getElementById('loginUsername').value;
            const p = document.getElementById('loginPassword').value;
            const t = authTranslations[currentLang] || authTranslations.en;

            try {
                btn.textContent = t.auth;
                btn.disabled = true;

                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: u,
                        password: p,
                        language: currentLang
                    })
                });

                const data = await res.json();

                if (res.ok && data.status === "success") {
                    localStorage.setItem('pepperSession', 'cookie');
                    localStorage.setItem('pepperUserId', data.user_id);
                    localStorage.setItem('pepperUsername', data.username);
                    clearGoogleProfileCompletionState();
                    if(data.display_name) localStorage.setItem('pepperDisplayName', data.display_name);
                    if(data.preferences) {
                        if(data.preferences.language) localStorage.setItem('pepperLang', data.preferences.language);
                    }
                    window.location.href = '/';
                } else if (!res.ok && data.status === "unverified") {
                    // Keep verification inside this left-side auth flow.
                    openEmailOtpForm(data.user_id, { source: 'login' });
                } else {
                    showToast(data.detail || t.loginFailed, true);
                    btn.textContent = t.submit;
                    btn.disabled = false;
                }
            } catch(error) {
                showToast(t.networkError, true);
                btn.textContent = t.submit;
                btn.disabled = false;
            }
        });

        document.getElementById('standaloneRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('registerSubmitBtn');
            const identity = validateNameFields('registerFirstName', 'registerLastName', 'registerNameError');
            const username = document.getElementById('registerUsername').value.trim();
            const region = document.getElementById('registerRegion').value;
            const password = document.getElementById('registerPassword').value;
            const t = authTranslations[currentLang] || authTranslations.en;

            if (!identity) {
                showToast(document.getElementById('registerNameError').textContent, true);
                return;
            }
            const phoneData = await validatePhoneField('registerCountryIso', 'registerPhone', 'registerPhoneError');
            if (!phoneData) {
                showToast(document.getElementById('registerPhoneError').textContent || t.invalidPhone, true);
                return;
            }
            if (!region) {
                showToast(t.invalidRegion, true);
                return;
            }
            if (!passwordMeetsPolicy(password)) {
                showRegisterPasswordRequirementsError();
                showToast(t.passwordRule, true);
                return;
            }

            try {
                btn.textContent = t.registerAuth;
                btn.disabled = true;
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username,
                        first_name: identity.firstName,
                        last_name: identity.lastName,
                        country_iso: phoneData.country_iso,
                        phone_number: phoneData.phone_number,
                        region,
                        password,
                        language: currentLang
                    })
                });
                const data = await res.json();
                if (res.ok && data.status === 'pending_verification') {
                    openEmailOtpForm(data.user_id, {
                        source: 'register',
                        resendCooldownSeconds: Number(data.resend_available_in) || EMAIL_OTP_RESEND_COOLDOWN_SECONDS,
                    });
                    return;
                }
                showToast(data.detail || t.registerFailed, true);
                btn.textContent = t.registerSubmit;
                btn.disabled = false;
            } catch (error) {
                showToast(t.networkError, true);
                btn.textContent = t.registerSubmit;
                btn.disabled = false;
            }
        });

        // =========================================================================
        // High-Tech 3D Particle Constellation Engine
        // =========================================================================
        const canvas = document.getElementById('techCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];

        function resize() {
            width = canvas.width = canvas.parentElement.clientWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle System
        const PARTICLE_COUNT = 150;
        const CONNECTION_DIST = 140;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                z: Math.random() * 2 + 0.1, // 3D depth multiplier
                vx: (Math.random() - 0.5) * 0.6,
                vy: (Math.random() - 0.5) * 0.6,
                baseVx: (Math.random() - 0.5) * 0.6,
                baseVy: (Math.random() - 0.5) * 0.6
            });
        }

        let mouseX = -1000;
        let mouseY = -1000;

        // Interactive Tracking
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
        });

        canvas.addEventListener('mouseleave', () => {
            mouseX = -1000;
            mouseY = -1000;
        });

        // Shatter Effect on Click
        canvas.addEventListener('mousedown', (e) => {
            if(e.button !== 0) return; // Only left click
            const rect = canvas.getBoundingClientRect();
            let mx = e.clientX - rect.left;
            let my = e.clientY - rect.top;

            // Blast radius
            particles.forEach(p => {
                let dx = p.x - mx;
                let dy = p.y - my;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 250) {
                    let force = (250 - dist) / 10; // Shatter explosive power
                    p.vx += (dx / dist) * force;
                    p.vy += (dy / dist) * force;
                }
            });
        });

        let time = 0;
        function animate() {
            // Clear background
            ctx.fillStyle = '#f4f5f8';
            ctx.fillRect(0, 0, width, height);

            // Tech Grid (Optional subtle background)
            ctx.lineWidth = 1;
            ctx.strokeStyle = 'rgba(0,0,0,0.02)';
            const gridSize = 60;
            ctx.beginPath();
            for(let x=0; x<width; x+=gridSize) { ctx.moveTo(x, 0); ctx.lineTo(x, height); }
            for(let y=0; y<height; y+=gridSize) { ctx.moveTo(0, y); ctx.lineTo(width, y); }
            ctx.stroke();

            const dotColor = '10, 20, 50';
            const lineColor = '10, 20, 50';

            // Slowly rotate the entire network around center to give 3D orbital feel
            time += 0.001;
            const cx = width / 2;
            const cy = height / 2;

            particles.forEach((p, i) => {
                // Interactive Mouse Pull/Push
                let dxCursor = mouseX - p.x;
                let dyCursor = mouseY - p.y;
                let distCursor = Math.sqrt(dxCursor*dxCursor + dyCursor*dyCursor);

                // Mouse repulsion field
                if (distCursor < 120) {
                    let force = (120 - distCursor) / 1000;
                    p.vx -= dxCursor * force;
                    p.vy -= dyCursor * force;
                }

                // Physics: Friction to slow down shards after shatter explosion
                p.vx += (p.baseVx - p.vx) * 0.02;
                p.vy += (p.baseVy - p.vy) * 0.02;

                // Drift
                p.x += p.vx * p.z;
                p.y += p.vy * p.z;

                // Wrap around edges to simulate infinite space
                if(p.x < -CONNECTION_DIST) p.x = width + CONNECTION_DIST;
                if(p.x > width + CONNECTION_DIST) p.x = -CONNECTION_DIST;
                if(p.y < -CONNECTION_DIST) p.y = height + CONNECTION_DIST;
                if(p.y > height + CONNECTION_DIST) p.y = -CONNECTION_DIST;

                // Draw Particle
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.z * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${dotColor}, ${0.2 + p.z*0.3})`;
                ctx.fill();
            });

            // Connect lines
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const pi = particles[i];
                    const pj = particles[j];
                    const dx = pi.x - pj.x;
                    const dy = pi.y - pj.y;
                    const distSQ = dx*dx + dy*dy;

                    if (distSQ < CONNECTION_DIST * CONNECTION_DIST) {
                        const dist = Math.sqrt(distSQ);
                        const alpha = 1 - (dist / CONNECTION_DIST);
                        ctx.beginPath();
                        ctx.moveTo(pi.x, pi.y);
                        // Add slight curve for 3D tension effect
                        ctx.quadraticCurveTo(cx + (pi.x - cx)*0.5, cy + (pi.y - cy)*0.5, pj.x, pj.y);
                        ctx.strokeStyle = `rgba(${lineColor}, ${alpha * 0.4})`;
                        ctx.lineWidth = ((pi.z + pj.z)/2) * 0.5;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
