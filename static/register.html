<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - bisnes.ai</title>
    <script>
        // Keep existing bookmarks and external registration links working while
        // registration now lives in the unified authentication page.
        (function () {
            const destination = new URL('/static/login.html', window.location.origin);
            const current = new URL(window.location.href);
            current.searchParams.set('mode', 'register');
            destination.search = current.search;
            destination.hash = current.hash;
            window.location.replace(destination.toString());
        })();
    </script>
</head>
<body></body>
</html>
