runtime:
  name: "bisnes.ai Copilot - Cyberjaya MYS1a"
  platform: "Ubuntu 24.04 + RTX 5090 (32GB VRAM)"

# Active model: Gemma 4 E4B (8.0B params, Q4_K_M, 131072 max context).
#
# Measured against the previous gemma4:12b on this box (2x RTX 5090), 10
# concurrent requests, num_ctx=4096, num_predict=192:
#     gemma4:12b   wall 27.4s   TTFT median 18.35s   70 tok/s aggregate
#     gemma4:e4b   wall 11.2s   TTFT median  5.53s  167 tok/s aggregate
#
# ROLLBACK: set both models back to "gemma4:12b" (still installed) and restart
# the server. See docs/MODEL_ROLLBACK.md.
model:
  think_model: "gemma4:e4b"
  fast_model: "gemma4:e4b"
  search_query_model: ""
  gguf_path: ""
  context_length: 32768

generation:
  max_new_tokens: 8192
  temperature: 0.42
  top_p: 0.9
  repetition_penalty: 1.08
  do_sample: true

server:
  host: "127.0.0.1"
  port: 8000
  public_site_url: "https://bisnes.ai"
  timezone: "Asia/Kuala_Lumpur"

database:
  mongodb:
    uri: "mongodb://localhost:27017/"
    database: "pepper_chat_db"
  pgvector:
    connection_uri: ""
    collection: "users_memory"

services:
  ollama:
    base_url: "http://127.0.0.1:11434"
    num_ctx_cap: 16384
    # Single context window for EVERY request. Changing num_ctx between
    # requests makes Ollama reload the model (~7.8s measured) and stalls all
    # other in-flight requests, which was the main cause of multi-user
    # stuttering. VRAM cost = num_ctx x OLLAMA_NUM_PARALLEL.
    num_ctx: 16384
    num_gpu: 99
    num_thread: 8

deployment:
  ssh:
    host: ""
    port: 22
    user: ""
    identity_file: ""
  docker:
    mongo_port: 27017
    pgvector_port: 5432
    ollama_port: 11434
    app_port: 8000

search:
  max_queries: 5
  max_results_per_query: 8
  max_results_total: 12
  min_results_total: 5
  snippet_length: 360
  timeout_seconds: 2
  html_timeout_seconds: 1.5
  deadline_seconds: 5
  max_workers: 5
