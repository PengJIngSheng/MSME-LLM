runtime:
  name: "MOF shared defaults"

model:
  think_model: "deepseek-r1-distill-qwen-14b"
  fast_model: "deepseek-r1-14b-fast"
  search_query_model: ""
  gguf_path: "./DeepSeek-R1-Distill-Qwen-14B-Q5_K_M.gguf"
  quant_mode: "4bit"
  context_length: 12288

generation:
  max_new_tokens: 10240
  temperature: 0.6
  top_p: 0.95
  repetition_penalty: 1.05
  do_sample: true
  default_think_mode: false

server:
  host: "0.0.0.0"
  port: 8000
  timezone: "Asia/Shanghai"
  public_site_url: "http://localhost:8000"
  max_history_turns: 20

database:
  mongodb:
    uri: "mongodb://localhost:27017/"
    database: "pepper_chat_db"
  pgvector:
    # Set PGVECTOR_CONNECTION_URI in an ignored secrets file.
    connection_uri: ""
    collection: "users_memory"

services:
  ollama:
    base_url: "http://localhost:11434"
    embedding_model: "nomic-embed-text"
    num_ctx_cap: 12288
    num_gpu: 99
    num_thread: 4
  smtp:
    host: "smtp.gmail.com"
    port: 587
    username: ""
    app_password: ""
    from_name: "MSME.AI"
  google:
    # Leave blank to reuse oauth_client_id for login. Set only when login needs a separate web client.
    login_oauth_client_id: ""
    oauth_client_id: "685645444928-ivt7lgsjiatv0ff0r68ckmbln1rdrrm4.apps.googleusercontent.com"
    oauth_client_secret: ""
    client_secret_file: "secrets/google_client_secret.json"

security:
  # Required. Set JWT_SECRET in config/secrets.<profile>.env; never commit it.
  jwt_secret: ""
  # Required only when Google Workspace connectors are enabled. Generate with:
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  google_token_encryption_key: ""
  jwt_algorithm: "HS256"
  jwt_expiration_hours: 24

deployment:
  ssh:
    host: ""
    port: 22
    user: ""
    identity_file: ""
  docker:
    mongo_port: 27017
    pgvector_port: 5432
    ollama_port: 11434
    app_port: 8000

search:
  max_queries: 5
  max_results_per_query: 8
  max_results_total: 12
  min_results_total: 5
  snippet_length: 360
  timeout_seconds: 2
  html_timeout_seconds: 1.5
  deadline_seconds: 5
  max_workers: 5
  blacklist_domains:
    - "kimi.ai"
    - "gemini.google.com"
    - "openai.com"
    - "copilot.microsoft.com"
    - "chat.openai.com"
    - "github.com"
    - "stackoverflow.com"
    - "youtube.com"
    - "youtu.be"
    - "twitter.com"
    - "x.com"
    - "facebook.com"
    - "instagram.com"
    - "linkedin.com"
    - "tiktok.com"
    - "pinterest.com"
    - "google.com"
    - "bing.com"
    - "yahoo.com"

web_search:
  brave_api_key: ""        # set via env BRAVE_SEARCH_API_KEY (preferred)
  tavily_api_key: ""       # set via env TAVILY_API_KEY (fallback)
  crawl4ai_base_url: ""    # leave empty to use crawl4ai Python lib directly
  cache_ttl_hours: 24      # how long fetched pages stay cached in pgvector
  max_results: 15          # max search results to consider per query
  max_pages: 6             # max pages to fetch and extract per query

knowledge_rag:
  enabled: true
  collection: "mof_finetune_knowledge"
  top_k: 8
  score_threshold: 0.70
  max_context_chars: 5000
