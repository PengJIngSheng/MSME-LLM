runtime:
  name: "Windows local RTX 4080"

# Moved here from the legacy root config.yaml, which used to be the only place
# these were set for this profile. Keeping them in the profile makes the active
# model obvious instead of depending on the legacy file's merge position.
model:
  think_model: "gemma4:26b"
  fast_model: "gemma4:26b"
  search_query_model: ""
  gguf_path: "./models/gemma-4-12b-it-Q4_K_M.gguf"
  quant_mode: "4bit"
  context_length: 12288

generation:
  max_new_tokens: 6144
  temperature: 0.6
  top_p: 0.95
  repetition_penalty: 1.05
  do_sample: true
  default_think_mode: false

search:
  max_queries: 4

server:
  host: "0.0.0.0"
  port: 8000
  public_site_url: "http://localhost:8000"
  timezone: "Asia/Shanghai"

database:
  mongodb:
    uri: "mongodb://localhost:27017/"
    database: "pepper_chat_db"
  pgvector:
    connection_uri: ""
    collection: "users_memory"

services:
  ollama:
    base_url: "http://localhost:11434"
    num_ctx_cap: 8192
    num_gpu: 99
    num_thread: 4

deployment:
  docker:
    mongo_port: 27017
    pgvector_port: 5432
    ollama_port: 11434
    app_port: 8000
